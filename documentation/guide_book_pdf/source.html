/* BPS Table Styling */
table.t{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:8px;border-top:1px solid #000}
table.t th{background:#FF6D1F;color:#fff;border:1px solid #fff;padding:2px 3px;text-align:center;font-weight:bold;line-height:1.2}

table.t tr.tt td{background:#FF6D1F;color:#fff;font-weight:bold}
table.t td.v{text-align:right;white-space:nowrap;padding-left:2px;padding-right:3px}

.tree-row{display:flex;align-items:center;justify-content:space-between;padding:2.5px 6px;border-radius:4px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:3px;font-size:8px}

.tree-row.lvl-1{margin-left:14px;border-left:3px solid #0ea5e9;background:#f8fafc}
.tree-row.lvl-tot{border-left:3px solid #f59e0b;background:#fffbeb;font-weight:700;color:#92400e}

.btn-or{background:linear-gradient(135deg,#FF6D1F,#ff8c42);color:#fff}
.btn-bl{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.btn-gr{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.f-input{font-size:8px;padding:2px 5px;border:1px solid #cbd5e1;border-radius:4px;width:100%;background:#fff}
.f-sel{font-size:7.5px;padding:1px 4px;border:1px solid #cbd5e1;border-radius:4px;background:#fff}

.btn{display:inline-block;border-radius:50px;padding:3px 11px;font-size:9.5px;font-weight:700;color:#fff;font-family:'Segoe UI',Arial,sans-serif}
.gr{background:linear-gradient(135deg,#059669,#10b981)}.or{background:#FF6D1F}.nv{background:var(--n);border-radius:6px}

.cv-circ{position:absolute;left:-210px;bottom:-250px;width:480px;height:480px;border-radius:50%;background:var(--n)}
</style>

<script>

const MK={
flow:`<div class="mk wide" style="display:flex;gap:8px;align-items:center;padding:34px 18px">
 ${[['1','Kelompok','Baris, Kolom, Waktu'],['2','Rakit','Generator Matriks'],['3','Export','Template Excel'],['4','Isi Data','di Excel'],['5','Import','Upload Excel']].map(x=>`<div class="fcard"><div class="fnum">${x[0]}</div><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>`,
