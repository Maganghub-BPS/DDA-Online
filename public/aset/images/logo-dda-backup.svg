<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="44" height="44" fill="none">
  <defs>
    <linearGradient id="ddaLogoBlue" x1="4" y1="4" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e5ba0"/>
      <stop offset="100%" stop-color="#113a68"/>
    </linearGradient>
    <linearGradient id="ddaLogoOrange" x1="18" y1="10" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b30"/>
      <stop offset="100%" stop-color="#ea4f10"/>
    </linearGradient>
    <linearGradient id="ddaBarBlue1" x1="14" y1="22" x2="20" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#154679"/>
    </linearGradient>
    <linearGradient id="ddaBarBlue2" x1="22" y1="14" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e5ba0"/>
    </linearGradient>
  </defs>

  <!-- Left Spine (Letter 'D' Backbone) -->
  <rect x="4" y="6" width="7" height="36" rx="3.5" fill="url(#ddaLogoBlue)"/>

  <!-- Ascending Statistical Growth Bars -->
  <!-- Bar 1: Foundation (Blue) -->
  <rect x="14" y="24" width="5.5" height="18" rx="2.75" fill="url(#ddaBarBlue1)"/>

  <!-- Bar 2: Growth (Sky to Navy) -->
  <rect x="22.5" y="16" width="5.5" height="26" rx="2.75" fill="url(#ddaBarBlue2)"/>

  <!-- Bar 3: Peak / Target (Vibrant BPS Orange) -->
  <rect x="31" y="8" width="5.5" height="34" rx="2.75" fill="url(#ddaLogoOrange)"/>

  <!-- Dynamic Curved Connection Arc / Data Flow completing the 'D' Loop -->
  <path d="M 4 39 C 4 39, 18 43.5, 36 39.5 C 41 38.5 44 34.5 44 29.5 L 44 15.5 C 44 10.5 39.5 7 34 7 L 31 7" stroke="url(#ddaLogoOrange)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Digital Connectivity Node / Satellite Spark -->
  <circle cx="44" cy="14" r="3" fill="#ff8c42"/>
</svg>
