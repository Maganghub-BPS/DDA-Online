<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 48" width="50" height="44" fill="none">
  <defs>
    <!-- BPS Navy Blue Gradient -->
    <linearGradient id="ddaNavy" x1="0" y1="0" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e5fa6"/>
      <stop offset="100%" stop-color="#103663"/>
    </linearGradient>
    
    <!-- BPS Vibrant Orange Gradient -->
    <linearGradient id="ddaOrange" x1="20" y1="10" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7b30"/>
      <stop offset="100%" stop-color="#ea4e10"/>
    </linearGradient>

    <!-- Bar Blue Gradients -->
    <linearGradient id="ddaBar1" x1="14" y1="24" x2="19" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b7cd3"/>
      <stop offset="100%" stop-color="#134780"/>
    </linearGradient>
    
    <linearGradient id="ddaBar2" x1="22" y1="16" x2="27" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d5ea5"/>
    </linearGradient>

    <!-- Warm Glow -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F26522" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 1. LEFT PILLAR & TOP ARCH (The 'D' Backbone in BPS Navy) -->
  <path d="M 6 10 C 6 6.686 8.686 4 12 4 L 28 C 30.2 4 32 5.8 32 8 C 32 10.2 30.2 12 28 12 L 13.5 12 C 12.67 12 12 12.67 12 13.5 L 12 38.5 C 12 39.33 11.33 40 10.5 40 L 8.5 40 C 7.12 40 6 38.88 6 37.5 Z" fill="url(#ddaNavy)"/>

  <!-- 2. ASCENDING DATA BARS (Growth & Accuracy) -->
  <!-- Bar 1 (Short) -->
  <rect x="15" y="24" width="5" height="17" rx="2.5" fill="url(#ddaBar1)"/>
  
  <!-- Bar 2 (Medium) -->
  <rect x="23" y="16" width="5" height="25" rx="2.5" fill="url(#ddaBar2)"/>
  
  <!-- Bar 3 (Tall) -->
  <rect x="31" y="8" width="5.5" height="33" rx="2.75" fill="url(#ddaOrange)" filter="url(#orangeGlow)"/>

  <!-- 3. DYNAMIC DATA SWOOSH & PIE WEDGE (The 'D' Loop & Analytics) -->
  <!-- Swoosh curving from bottom upward, creating the outer D silhouette -->
  <path d="M 12 41 C 20 44 32 43 40 37 C 46 32 47 24 47 18 L 47 10 C 47 7.79 45.21 6 43 6 C 40.79 6 39 7.79 39 10 L 39 18 C 39 23 37 28 32 31 C 28 33.4 22 34 16 33.5" stroke="url(#ddaOrange)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mini Modern Data Indicator Node -->
  <circle cx="43" cy="8" r="3.2" fill="#ff8c42" filter="url(#orangeGlow)"/>
</svg>
